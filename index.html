  --soft: #f6efe3;
  --ok: #2e7a4c;
  --ok-bg: #e5f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --h: #c0473f;
  --w: #b98a2c;
  --k: #2f6c98;
  --j: #5c8f3a;
  --shadow: 0 1px 2px rgba(60, 40, 20, .06), 0 8px 24px rgba(60, 40, 20, .07);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1b1916; --paper: #25221e; --ink: #ede6da; --muted: #a79b8c; --line: #3a342d;
    --accent: #d9645f; --accent-ink: #1b1916; --soft: #2d2924;
    --ok: #6cc28f; --ok-bg: #1f3428; --bad: #ef8a83; --bad-bg: #3a2220;
    --h: #e2716a; --w: #dcb35a; --k: #6aa6d4; --j: #8fc26a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1b1916; --paper: #25221e; --ink: #ede6da; --muted: #a79b8c; --line: #3a342d;
  --accent: #d9645f; --accent-ink: #1b1916; --soft: #2d2924;
  --ok: #6cc28f; --ok-bg: #1f3428; --bad: #ef8a83; --bad-bg: #3a2220;
  --h: #e2716a; --w: #dcb35a; --k: #6aa6d4; --j: #8fc26a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 17px/1.55 "PT Serif", Georgia, serif;
}
button, select { font: inherit; color: inherit; }
.muted { color: var(--muted); }

.top {
  max-width: 760px; margin: 0 auto; padding: 14px 16px 0;
}
.brand {
  background: none; border: 0; padding: 0; cursor: pointer;
  font: 700 15px/1 "PT Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase;
  color: var(--accent);
}
#app { max-width: 760px; margin: 0 auto; padding: 12px 16px 24px; }
.foot { max-width: 760px; margin: 0 auto; padding: 0 16px 32px; font: 13px "PT Sans", sans-serif; color: var(--muted); }

/* ---------- Старт ---------- */
.hero { padding: 24px 0 8px; }
.eyebrow { font: 700 13px "PT Sans", sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.hero h1 { font-size: clamp(34px, 7vw, 54px); line-height: 1.05; margin: 8px 0 14px; }
.lead { font-size: 19px; max-width: 36em; margin: 0 0 22px; }
.start {
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow);
}
.start label { font: 700 14px "PT Sans", sans-serif; color: var(--muted); width: 100%; }
.start select {
  flex: 1 1 260px; min-width: 0; padding: 11px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--soft); font-family: "PT Sans", sans-serif;
}
.how { list-style: none; padding: 0; margin: 26px 0 0; display: grid; gap: 12px; }
.how li { padding-left: 16px; border-left: 3px solid var(--accent); }

/* ---------- Кнопки ---------- */
.primary, .ghost {
  border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer;
  font: 700 16px "PT Sans", sans-serif;
}
.primary { background: var(--accent); color: var(--accent-ink); }
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; border: 1px solid var(--line); }
.ghost:hover { background: var(--soft); }
.next { margin-top: 18px; }
.key {
  display: inline-grid; place-items: center; flex: none;
  width: 22px; height: 22px; margin-right: 10px; border-radius: 6px;
  border: 1px solid var(--line); font: 700 12px "PT Sans", sans-serif; color: var(--muted);
}

/* ---------- Панель персонажа ---------- */
.status {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 14px 16px; box-shadow: var(--shadow); margin-bottom: 14px;
}
.status-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.who { font-weight: 700; font-size: 18px; line-height: 1.25; }
.meta { font: 14px "PT Sans", sans-serif; color: var(--muted); margin-top: 2px; }
.when { text-align: right; flex: none; }
.year { font-size: 32px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.age { font: 14px "PT Sans", sans-serif; color: var(--muted); margin-top: 4px; }
.realm {
  display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 10px 0 12px; padding-top: 10px; border-top: 1px dashed var(--line);
  font: 14px "PT Sans", sans-serif;
}
.realm span:first-child { font-weight: 700; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; }
.bar { display: grid; grid-template-columns: 76px 1fr 26px; align-items: center; gap: 8px; font: 13px "PT Sans", sans-serif; }
.bar-label { color: var(--muted); }
.bar-track { height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; border: 1px solid var(--line); }
.bar-track span { display: block; height: 100%; border-radius: 99px; transition: width .5s ease; }
.bar-h .bar-track span { background: var(--h); }
.bar-w .bar-track span { background: var(--w); }
.bar-k .bar-track span { background: var(--k); }
.bar-j .bar-track span { background: var(--j); }
.bar-num { text-align: right; font-variant-numeric: tabular-nums; }
@media (max-width: 520px) { .bars { grid-template-columns: 1fr; } }

/* ---------- Карточка события ---------- */
.card {
  background: var(--paper); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; box-shadow: var(--shadow); scroll-margin-top: 12px;
}
.card.enter, .card.birth, .card.epitaph { animation: rise .35s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .card.enter, .card.birth, .card.epitaph { animation: none; } }
.card-head { display: flex; gap: 14px; align-items: flex-start; }
.icon {
  flex: none; width: 52px; height: 52px; display: grid; place-items: center; font-size: 28px;
  background: var(--soft); border-radius: 12px; border: 1px solid var(--line);
}
.tag { font: 700 12px "PT Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.card h2 { margin: 2px 0 2px; font-size: 25px; line-height: 1.2; }
.date { font: 14px "PT Sans", sans-serif; color: var(--muted); }
.text { margin: 14px 0 0; }
.childnote { margin: 14px 0 0; font-style: italic; color: var(--muted); }
.news {
  margin-top: 14px; padding: 10px 12px; border-radius: 10px; background: var(--soft);
  font: 15px/1.45 "PT Sans", sans-serif;
}
.choices, .opts { display: grid; gap: 8px; margin-top: 16px; }
.choice, .opt {
  display: flex; align-items: center; text-align: left; width: 100%;
  padding: 12px 14px; border-radius: 10px; cursor: pointer;
  background: var(--paper); border: 1px solid var(--line);
  font: 16px/1.35 "PT Sans", sans-serif;
  transition: border-color .15s, background .15s;
}
.choice:hover, .opt:not([disabled]):hover { border-color: var(--accent); background: var(--soft); }
.opt[disabled] { cursor: default; }
.opt-right { border-color: var(--ok); background: var(--ok-bg); }
.opt-wrong { border-color: var(--bad); background: var(--bad-bg); }
.opt-dim { opacity: .55; }
.result { margin: 16px 0 0; padding-left: 14px; border-left: 3px solid var(--line); }
.death {
  margin-top: 16px; padding: 12px 14px; border-radius: 10px;
  background: var(--soft); border: 1px solid var(--line); font-weight: 700;
}

.quiz { margin-top: 20px; padding-top: 16px; border-top: 1px dashed var(--line); }
.quiz-h { font: 700 13px "PT Sans", sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--k); }
.quiz-q { margin: 6px 0 0; font-weight: 700; }
.verdict { margin-top: 12px; font: 700 15px "PT Sans", sans-serif; }
.verdict.ok { color: var(--ok); }
.verdict.bad { color: var(--bad); }
.fact {
  margin-top: 12px; padding: 12px 14px; border-radius: 10px; background: var(--soft);
  font: 15px/1.5 "PT Sans", sans-serif;
}

/* ---------- Рождение и итоги ---------- */
.birth h2, .epitaph h2 { font-size: 30px; margin-top: 4px; }
.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 0; }
.facts div { background: var(--soft); border-radius: 10px; padding: 10px 12px; }
.facts dt { font: 12px "PT Sans", sans-serif; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.facts dd { margin: 2px 0 0; font-weight: 700; }
@media (max-width: 520px) { .facts { grid-template-columns: 1fr; } }
.epitaph { text-align: center; }
.epitaph .fact { text-align: left; }
.dates { font-size: 20px; color: var(--muted); }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px 0 4px; }
.score > div { background: var(--soft); border-radius: 12px; padding: 12px 6px; }
.big { font-size: 24px; font-weight: 700; line-height: 1.15; }
.big span { font-size: 16px; color: var(--muted); }
.score .muted { font: 13px "PT Sans", sans-serif; }
.end-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 18px; }

/* ---------- Летопись ---------- */
.chronicle {
  margin-top: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 4px 16px;
}
.chronicle summary { cursor: pointer; padding: 10px 0; font-weight: 700; }
.chronicle ol { list-style: none; margin: 0; padding: 0 0 12px; }
.chronicle li {
  display: grid; grid-template-columns: 82px 1fr; gap: 10px; padding: 6px 0;
  border-top: 1px solid var(--line); font: 15px/1.4 "PT Sans", sans-serif;
}
.log-y { color: var(--muted); font-variant-numeric: tabular-nums; }
.log-quiet .log-t, .log-missed .log-t { color: var(--muted); font-style: italic; }
.log-rename .log-t::before { content: "📰 "; }
.log-death .log-t { font-weight: 700; }
.log-birth .log-t { font-weight: 700; }

/* ---------- Судьбы ---------- */
.fate-name { font: 700 13px "PT Sans", sans-serif; color: var(--accent); margin-bottom: 2px; }
.fate-big { font: 700 15px "PT Sans", sans-serif; color: var(--accent); margin-top: 6px; }
.teaser { font-style: italic; }
.card.story { border-left: 4px solid var(--accent); }
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.badges.center { justify-content: center; }
.badge {
  font: 700 12px "PT Sans", sans-serif; padding: 4px 10px; border-radius: 99px;
  background: var(--soft); border: 1px solid var(--line); color: var(--ink);
}
.stake {
  margin-top: 8px; padding: 10px 12px; border-radius: 10px;
  background: var(--bad-bg); border: 1px solid var(--bad); font: 700 14px/1.4 "PT Sans", sans-serif;
}
.fate { margin-top: 10px; padding: 10px 12px; border-radius: 10px; font: 700 15px/1.45 "PT Sans", sans-serif; }
.fate.ok { background: var(--ok-bg); color: var(--ok); }
.fate.bad { background: var(--bad-bg); color: var(--bad); }
.statbox {
  margin-top: 12px; padding: 12px 14px; border-radius: 10px; border: 1px dashed var(--line);
  font: 14px/1.5 "PT Sans", sans-serif;
}
.statbox ul { margin: 6px 0 0; padding-left: 18px; }
.check { display: flex !important; gap: 8px; align-items: flex-start; font: 14px/1.4 "PT Sans", sans-serif !important; color: var(--muted); width: 100%; cursor: pointer; }
.check input { margin-top: 3px; }
.log-beat .log-t { font-weight: 700; }
.log-win .log-t { color: var(--ok); }
.log-lose .log-t { color: var(--bad); }

/* ---------- Задания ЕГЭ ---------- */
.task-q { margin: 8px 0 0; font-weight: 700; }
.order { display: grid; gap: 8px; margin-top: 12px; }
.order-item {
  display: flex; align-items: center; gap: 0; text-align: left; width: 100%;
  padding: 12px 14px; border-radius: 10px; cursor: pointer;
  background: var(--paper); border: 1px solid var(--line); font: 16px/1.35 "PT Sans", sans-serif;
}
.order-item:not([disabled]):hover { border-color: var(--accent); background: var(--soft); }
.order-item.picked { border-color: var(--k); background: var(--soft); }
.order-item.picked .key { background: var(--k); color: #fff; border-color: var(--k); }
.order-item[disabled] { cursor: default; }
.order-item .yr { margin-left: auto; padding-left: 10px; font-weight: 700; color: var(--muted); }
.opts-list { margin: 10px 0 0; padding-left: 22px; font: 15px/1.45 "PT Sans", sans-serif; }
.opts-list li { margin: 3px 0; }
.match { display: grid; gap: 8px; margin-top: 12px; }
.match-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 15px/1.35 "PT Sans", sans-serif; }
.match-label { flex: 1 1 180px; font-weight: 700; }
.match-row select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); min-width: 64px; }
.match-row .ok { color: var(--ok); font-weight: 700; }
.match-row .bad { color: var(--bad); font-weight: 700; }
.primary.small, .ghost.small { padding: 8px 14px; font-size: 14px; margin-top: 10px; }
.verdict.mid { color: var(--w); }
.stake-rule { font-weight: 400; margin-top: 4px; }
.result.note { border-left-color: var(--bad); color: var(--bad); }

/* ---------- Показатели ---------- */
.bar.low .bar-label, .bar.low .bar-num { color: var(--bad); font-weight: 700; }
.warn { margin-top: 10px; padding: 8px 12px; border-radius: 10px; background: var(--soft); font: 13px/1.45 "PT Sans", sans-serif; }
.ctag { display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 99px; font-size: 12px; background: var(--soft); color: var(--muted); border: 1px solid var(--line); }
.ctag.danger { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.choice[disabled] { opacity: .55; cursor: not-allowed; }

/* ---------- Портрет и семья ---------- */
.avatar { image-rendering: pixelated; flex: none; background: var(--soft); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
.avatar.dead { filter: grayscale(1) contrast(.9); opacity: .85; }
.who-wrap { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.family { font: 13px/1.4 "PT Sans", sans-serif; color: var(--muted); margin-top: 4px; }
.birth-head { display: flex; gap: 16px; align-items: center; margin-top: 6px; }
.birth-head h2 { margin: 0; }
.end-portrait { display: flex; justify-content: center; margin: 8px 0 4px; }
.family-end ul { margin: 6px 0 0; padding-left: 18px; }

/* ---------- Последствия выбора ---------- */
.deltas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.dchip { font: 700 12px "PT Sans", sans-serif; padding: 3px 9px; border-radius: 99px; }
.dchip.up { background: var(--ok-bg); color: var(--ok); }
.dchip.down { background: var(--bad-bg); color: var(--bad); }
.log-family .log-t::before { content: "👪 "; }

/* ---------- Новые типы заданий ---------- */
.odd { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.odd-item {
  padding: 9px 12px; border-radius: 10px; cursor: pointer; background: var(--paper);
  border: 1px solid var(--line); font: 15px "PT Sans", sans-serif;
}
.odd-item.picked { border-color: var(--k); background: var(--soft); font-weight: 700; }
.odd-item.right { border-color: var(--ok); background: var(--ok-bg); }
.odd-item.wrong { border-color: var(--bad); background: var(--bad-bg); }
.odd-item[disabled] { cursor: default; }
.odd-item .yr { margin-left: 8px; color: var(--muted); font-size: 12px; }
.year-row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
.year-row input { width: 120px; padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); font: 16px "PT Sans", sans-serif; }
.year-row .primary.small { margin-top: 0; }

/* ---------- Испытания ---------- */
.trial { margin: 12px 0; padding: 14px 16px; border-radius: 12px; font: 16px/1.45 "PT Sans", sans-serif; border: 2px solid; }
.trial.ok { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.trial.bad { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.trial-h { font: 700 18px "PT Sans", sans-serif; margin-bottom: 4px; }
.stake .trial-h { font-size: 15px; }

/* ---------- Подвал ---------- */
.foot { display: flex; justify-content: center; padding: 8px 16px 36px; }
.brand-link { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); font: 14px/1.4 "PT Sans", sans-serif;
  padding: 10px 16px; border-radius: 14px; background: var(--paper); border: 1px solid var(--line); }
.brand-link:hover { border-color: var(--accent); }
.brand-link img { flex: none; }

/* =====================================================================
   Фирменный стиль «История и котики»: персиковый фон, кремовые карточки,
   тёмно-синий текст, оранжевый акцент, мягкие плашки и круглые значки.
   ===================================================================== */
:root {
  --bg: #fdeee2;
  --paper: #fff8ef;
  --ink: #1d2766;
  --muted: #6d6f8c;
  --line: #f4dcc4;
  --accent: #f15a22;
  --accent-ink: #fff;
  --soft: #fdeedb;
  --chip: #fde1c2;
  --gold: #fbb31a;
  --ok: #3b8c4a;
  --ok-bg: #d9efd6;
  --bad: #e2471c;
  --bad-bg: #fde1d5;
  --h: #e2471c;
  --w: #fbb31a;
  --k: #2f4bb3;
  --j: #4fa35c;
  --shadow: 0 1px 2px rgba(150, 80, 20, .06), 0 10px 28px rgba(150, 80, 20, .08);
  --display: "Rubik", "PT Sans", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #171b38; --paper: #222850; --ink: #f8ecdf; --muted: #b7b3c9; --line: #343b6b;
    --accent: #ff7a45; --accent-ink: #171b38; --soft: #2a3160; --chip: #3a3566; --gold: #fbb31a;
    --ok: #7fd08d; --ok-bg: #1f3a2c; --bad: #ff8a66; --bad-bg: #44263a;
    --h: #ff7a5c; --w: #fbc23a; --k: #8aa2ff; --j: #7fd08d;
  }
}
:root[data-theme="dark"] {
  --bg: #171b38; --paper: #222850; --ink: #f8ecdf; --muted: #b7b3c9; --line: #343b6b;
  --accent: #ff7a45; --accent-ink: #171b38; --soft: #2a3160; --chip: #3a3566; --gold: #fbb31a;
  --ok: #7fd08d; --ok-bg: #1f3a2c; --bad: #ff8a66; --bad-bg: #44263a;
}

/* Шапка: название слева, логотип справа — как на плакатах */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 18px; }
.brand { font: 800 15px var(--display); letter-spacing: .04em; color: var(--ink); text-transform: uppercase; }
.brand span { color: var(--accent); }
.top-logo { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink);
  font: 800 12px/1.05 var(--display); text-transform: uppercase; letter-spacing: .02em; }
.top-logo img { display: block; }

/* Заголовки: крупные, тёмно-синие, с оранжевым акцентом */
.hero h1 { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; color: var(--ink); }
.hero h1 .hl { color: var(--accent); }
.eyebrow { display: inline-block; padding: 5px 12px; border-radius: 99px; background: var(--chip); color: var(--ink); font-family: var(--display); font-weight: 700; letter-spacing: .04em; }
.card h2, .birth h2, .epitaph h2 { font-family: var(--display); font-weight: 800; color: var(--ink); }
.year { font-family: var(--display); font-weight: 800; color: var(--accent); }
.who { font-family: var(--display); font-weight: 700; }

/* Карточки — кремовые, мягко скруглённые, с персиковой рамкой */
.card, .status, .chronicle, .start { border-radius: 20px; border: 2px solid var(--line); }
.card.story { border-left: 2px solid var(--line); box-shadow: inset 5px 0 0 var(--accent), var(--shadow); }

/* Плашки-«пилюли» вместо мелких подписей */
.tag { display: inline-block; padding: 4px 12px; border-radius: 99px; background: var(--chip); color: var(--ink);
  font: 700 12px var(--display); letter-spacing: .05em; margin-bottom: 4px; }
.card.story .tag { background: var(--accent); color: var(--accent-ink); }

/* Круглый значок события — жёлтый, как звёздочки на плакатах */
.icon { width: 50px; height: 50px; border-radius: 50%; background: var(--gold); border: 0; box-shadow: 0 2px 0 rgba(0,0,0,.06); }

/* Варианты выбора и кнопки */
.primary { background: var(--accent); border-radius: 99px; font-family: var(--display); font-weight: 700; padding: 12px 22px; }
.ghost { border-radius: 99px; font-family: var(--display); font-weight: 700; border: 2px solid var(--line); }
.choice, .opt, .order-item, .odd-item { border-radius: 14px; border: 2px solid var(--line); }
.choice:hover, .opt:not([disabled]):hover, .order-item:not([disabled]):hover { border-color: var(--accent); background: var(--soft); }
.key { border-radius: 50%; border: 0; background: var(--chip); color: var(--ink); font-family: var(--display); }

/* Задание: плашка со звёздочкой */
.quiz { border-top: 2px dashed var(--line); }
.quiz-h { display: inline-flex; align-items: center; gap: 8px; padding: 4px 14px 4px 4px; border-radius: 99px;
  background: var(--chip); color: var(--ink); font: 700 14px var(--display); letter-spacing: .02em; text-transform: none; }
.quiz-h::before { content: "★"; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
  background: var(--gold); color: #fff; font-size: 14px; }

/* Верно / неверно — зелёный и оранжево-красный значки, как «Правильно / Неправильно» */
.verdict { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 5px 14px 5px 5px; border-radius: 99px; font-family: var(--display); font-weight: 700; }
.verdict.ok { background: var(--ok-bg); }
.verdict.bad { background: var(--bad-bg); }
.verdict.mid { background: #fff0cc; color: #a26a00; }
.verdict::before { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; color: #fff; font-size: 14px; flex: none; }
.verdict.ok::before { content: "✓"; background: var(--ok); }
.verdict.bad::before { content: "✕"; background: var(--bad); }
.verdict.mid::before { content: "½"; background: var(--gold); }

/* Испытание */
.stake { background: #fff0cc; border: 2px solid var(--gold); color: var(--ink); border-radius: 16px; }
.trial { border-radius: 16px; }
.trial-h { font-family: var(--display); font-weight: 800; }

/* Справка — как блок «Что такое век?» */
.fact, .statbox, .news { border-radius: 16px; background: var(--soft); border: 0; }
.fact b:first-child { font-family: var(--display); }

/* Значки-достижения и последствия */
.badge { background: var(--chip); border: 0; font-family: var(--display); color: var(--ink); }
.dchip { font-family: var(--display); }
.ctag.danger { background: var(--bad-bg); border-color: var(--bad); }

/* Шкалы показателей потолще и мягче */
.bar-track { height: 10px; border: 0; background: var(--chip); }
.realm { border-top: 2px dashed var(--line); }

/* Как играть — пункты со звёздочками */
.how li { border-left: 0; padding-left: 36px; position: relative; }
.how li::before { content: "★"; position: absolute; left: 0; top: 0; width: 26px; height: 26px; border-radius: 50%;
  display: grid; place-items: center; background: var(--gold); color: #fff; font-size: 13px; }

/* Портрет */
.avatar { background: var(--chip); border: 0; border-radius: 14px; }
.end-portrait .avatar { padding: 8px; border-radius: 20px; }

/* Подвал */
.brand-link { border: 2px solid var(--line); border-radius: 18px; }
.brand-link b { font-family: var(--display); text-transform: uppercase; letter-spacing: .02em; }

</style>
</head>

  <script>
/* Движок игры «Одна жизнь в России». Данные — в data.js, data-ancient.js, stats.js, facts.js, avatar.js и fates-*.js. */
(() => {
  'use strict';
  const D = window.GAME_DATA;
  const app = document.getElementById('app');
  const STORE = 'zhizn-v-rossii-862-v1';
  const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = a => a[Math.floor(Math.random() * a.length)];
  const wpick = pairs => {
    let r = Math.random() * pairs.reduce((t, p) => t + p[1], 0);
    for (const [k, w] of pairs) if ((r -= w) < 0) return k;
    return pairs[0][0];
  };
  const shuffle = a => {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const plural = (n, one, few, many) => {
    const m = Math.abs(n) % 100, d = m % 10;
    if (m > 10 && m < 20) return many;
    if (d > 1 && d < 5) return few;
    return d === 1 ? one : many;
  };
  const ageStr = n => n + ' ' + plural(n, 'год', 'года', 'лет');
  const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
  const val = (x, ...args) => (typeof x === 'function' ? x(...args) : x);
  const TILLERS = ['smerd', 'serf', 'statepeasant', 'peasant', 'kolkhoz', 'kholop'];
  const WARS = [[1812, 1814, 0.05], [1854, 1855, 0.04], [1877, 1878, 0.03], [1904, 1905, 0.03], [1914, 1917, 0.05], [1918, 1920, 0.05], [1941, 1945, 0.09], [1979, 1988, 0.003], [1994, 1996, 0.005]];

  let S = null;   // состояние текущей жизни
  let cur = null; // событие на экране

  // ---------- Память игрока (только в этом браузере) ----------
  function load(k, d) { try { const v = JSON.parse(localStorage.getItem(STORE + ':' + k)); return v == null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem(STORE + ':' + k, JSON.stringify(v)); } catch (e) { /* приватный режим */ } }
  const stats = () => load('stats', { lives: 0, ok: 0, total: 0, longest: 0 });

  // ---------- Справочные функции ----------
  const byYear = (table, y) => { let v = table[0][1]; for (const [from, name] of table) if (y >= from) v = name; return v; };
  const placeEntry = (id, y) => { let e = D.PLACES[id].names[0]; for (const n of D.PLACES[id].names) if (y >= n[0]) e = n; return e; };
  const avail = (id, y) => { const p = D.PLACES[id]; return !p.foreign && !p.noBirth && (!p.born || (y >= p.born[0] && y <= p.born[1])); };
  const stateName = () => S.flags.emigrant ? 'Эмиграция' : byYear(D.STATES, S.year);
  const ruler = () => byYear(D.RULERS, S.year);
  const sexIdx = () => (S.g === 'm' ? 0 : 1);
  const warRisk = y => { for (const [a, b, r] of WARS) if (y >= a && y <= b) return r; return 0; };

  // Подстановки: {м|ж}, {city}, {inCity}, {age}, {name}
  function T(x) {
    x = val(x, S);
    if (!x) return '';
    const p = placeEntry(S.place, S.year);
    return String(x)
      .replace(/\{([^{}|]*)\|([^{}|]*)\}/g, (m, a, b) => (S.g === 'm' ? a : b))
      .replace(/\{city\}/g, p[1]).replace(/\{inCity\}/g, p[2])
      .replace(/\{age\}/g, ageStr(S.age)).replace(/\{name\}/g, S.first);
  }
  function fullName() {
    if (S.flags.nosurname) return `${S.first}, ${S.patr[2]}${S.g === 'm' ? ' сын' : 'а дочь'}`;
    return `${S.last} ${S.first} ${S.patr[sexIdx()]}`;
  }
  const shortName = () => (S.flags.nosurname ? S.first : `${S.first} ${S.patr[sexIdx()]}`);
  function addLog(text, type, y1 = S.year, y2 = null) { S.log.push({ y1, y2, age: S.age, text, type }); }
  function eraName(g, y) {
    const N = D.NAMES[g];
    return pick(y < 1000 ? N.ancient : y < 1917 ? N.old : y < 1950 ? N.old.concat(N.sov) : N.sov.concat(N.old.slice(0, 6)));
  }

  // ---------- Рождение: выбор судьбы ----------
  function pickFate(eraKey) {
    const era = D.ERAS[eraKey];
    let pool = D.FATES.filter(f => eraKey === 'random' || (f.birth >= era.range[0] && f.birth <= era.range[1]));
    if (!pool.length) pool = D.FATES;
    const played = load('played', []);
    const fresh = pool.filter(f => !played.includes(f.id));
    return pick(fresh.length ? fresh : pool);
  }

  function newLife(eraKey) {
    const F = pickFate(eraKey);
    const C = D.CLASS[F.cls];
    S = {
      fate: F, g: F.g, first: F.first, last: F.last, patr: F.patr,
      birth: F.birth, year: F.birth, age: 0, day: rnd(1, 28), month: rnd(0, 11),
      cls: F.cls, place: F.place, prof: F.prof || '',
      st: Object.assign({ h: rnd(65, 85), w: clamp(C.w + rnd(-5, 5)), k: clamp(C.k + rnd(0, 5)), j: rnd(45, 60) }, F.st || {}),
      flags: Object.assign({}, F.flags || {}), tmp: {}, done: {}, rolled: {}, log: [], news: [], rulers: [], badges: [],
      spouse: null, exSpouses: [], children: [], echoes: [],
      score: { ok: 0, total: 0 }, sinceTask: 2, freeTasks: 0, lastType: '', usedF: new Set(),
      kids: 0, kidsLost: 0, alive: true, cause: '', ended: false,
      realism: load('realism', false),
    };
    if (F.nosurname) S.flags.nosurname = true;
    for (const id of F.skip || []) S.done[id] = 1;
    // Сюжетная «защита»: до последнего поворота судьбы герой не умирает от случайной болезни или общих бедствий
    S.armor = F.armor ?? Math.max(...F.beats.map(b => b.age ? b.age[0] : (b.year - F.birth)));
    S.cityName = placeEntry(S.place, S.birth)[1];
    S.rulers.push(ruler());
    addLog(`${T('{Родился|Родилась}')} ${placeEntry(S.place, S.birth)[2]}, в ${T(C.birth)}`, 'birth');
    renderBirth();
  }

  // ---------- Семья ----------
  function marry() {
    if (S.spouse && S.spouse.alive) return;
    const g = S.g === 'm' ? 'f' : 'm';
    const age = S.g === 'm' ? Math.max(16, S.age - rnd(0, 6)) : S.age + rnd(0, 7);
    if (S.spouse) S.exSpouses.push(S.spouse);
    S.spouse = { g, name: eraName(g, S.year - age), birth: S.year - age, alive: true };
    S.flags.married = true;
    delete S.flags.widow;
    addLog(`${g === 'f' ? 'Жена' : 'Муж'} — ${S.spouse.name}, ${ageStr(age)}`, 'family');
  }
  function spouseDies(cause) {
    const sp = S.spouse;
    sp.alive = false; sp.died = S.year; sp.cause = cause;
    S.flags.married = false; S.flags.widow = true;
    S.st.j = clamp(S.st.j - 25);
    const msg = `${sp.g === 'f' ? 'Умерла ваша жена' : 'Умер ваш муж'} ${sp.name}: ${cause}.`;
    S.news.push(msg + ' Вы остались одн' + (S.g === 'm' ? 'им' : 'ой') + '.');
    addLog(msg, 'family');
  }
  function addChild(g) {
    S.children.push({ g, name: eraName(g, S.year), birth: S.year, alive: true });
  }
  function childDies(c, cause) {
    c.alive = false; c.died = S.year; c.cause = cause;
  }
  function familyTick() {
    const sp = S.spouse;
    if (sp && sp.alive) {
      const a = S.year - sp.birth, p = D.statFor(S.year);
      const q = Math.min(0.6, p.a[sp.g === 'm' ? 0 : 1] * Math.exp(0.085 * (a - 20)) * 1.1);
      const war = sp.g === 'm' && a >= 18 && a <= 50 && !S.flags.emigrant ? warRisk(S.year) : 0;
      if (Math.random() < war) spouseDies('погиб на войне');
      else if (a >= 15 && Math.random() < q) spouseDies(a >= 75 ? 'от старости' : 'от болезни');
    }
    for (const c of S.children) {
      if (!c.alive) continue;
      const a = S.year - c.birth;
      const war = c.g === 'm' && a >= 18 && a <= 50 && !S.flags.emigrant ? warRisk(S.year) : 0;
      if (Math.random() < war) {
        childDies(c, `погиб на войне в ${S.year} году`);
        S.st.j = clamp(S.st.j - 30);
        S.news.push(`Страшная весть: ваш сын ${c.name} погиб на войне. Ему было ${ageStr(a)}.`);
        addLog(`Погиб на войне сын ${c.name}`, 'family');
      } else if (a > 20 && Math.random() < D.statFor(S.year).a[c.g === 'm' ? 0 : 1] * Math.exp(0.085 * (a - 20))) {
        childDies(c, `умер${c.g === 'f' ? 'ла' : ''} в ${S.year} году`);
        S.st.j = clamp(S.st.j - 20);
        S.news.push(`Умер${c.g === 'f' ? 'ла ваша дочь' : ' ваш сын'} ${c.name}.`);
        addLog(`Умер${c.g === 'f' ? 'ла дочь' : ' сын'} ${c.name}`, 'family');
      }
    }
  }

  // ---------- Течение жизни ----------
  function giveSurname(why) {
    delete S.flags.nosurname;
    S.news.push(`${why} Теперь вас записывают так: ${fullName()}.`);
  }
  function normalizeClass() {
    const y = S.year, c = S.cls;
    if (c === 'smerd' && y >= 1400) S.cls = 'peasant';
    if (c === 'peasant' && y >= 1649 && y < 1861) S.cls = Math.random() < 0.6 ? 'serf' : 'statepeasant';
    if (c === 'kholop' && y >= 1723 && y < 1861) S.cls = 'serf';
    if (c === 'boyar' && y >= 1700) S.cls = 'noble';
    if (c === 'posad' && y >= 1785) S.cls = 'meshchanin';
    if (y >= 1862 && (S.cls === 'serf' || S.cls === 'statepeasant')) S.cls = 'peasant';
    if (S.flags.nosurname) {
      if (y >= 1862) giveSurname('После отмены крепостного права всем бывшим крепостным записали фамилии — часто по имени деда или по прозвищу.');
      else if (S.cls === 'boyar' && y >= 1550) giveSurname('Боярские роды в XVI веке закрепили за собой родовые фамилии.');
      else if (y >= 1700 && !TILLERS.includes(S.cls) && S.cls !== 'cossack') giveSurname('В XVIII веке фамилии закрепились за горожанами, купцами и служилыми людьми.');
    }
    if (S.flags.emigrant) return;
    if (y >= 1918 && ['noble', 'merchant', 'clergy'].includes(S.cls)) S.cls = 'former';
    if (y >= 1918 && S.cls === 'meshchanin') S.cls = 'worker';
    if (y >= 1920 && S.cls === 'cossack') S.cls = 'peasant';
    if (y >= 1932 && S.cls === 'peasant') S.cls = 'kolkhoz';
  }

  // Доход: уровень, к которому тянется достаток, — от сословия и профессии
  function income() {
    let base = D.CLASS[S.cls]?.w ?? 20;
    const p = S.prof || '';
    if (/купец|купчиха|предприним|кооператор|нэпман|челнок|торгов/.test(p)) base += 20;
    else if (/офицер|инженер|врач|чиновник|фрейлина|пилот|прапорщик|воевода|ювелир|специалист|командир/.test(p)) base += 12;
    else if (/беспризор|батрак|бортник|гулящ|беглый|нищ/.test(p)) base -= 12;
    else if (p) base += 3;
    if (S.flags.repressed && S.place === 'sib') base -= 10;
    if (S.flags.emigrant) base -= 5;
    return clamp(base);
  }
  const incomeLabel = () => { const i = income(); return i < 12 ? 'нищенский' : i < 25 ? 'низкий' : i < 45 ? 'средний' : i < 65 ? 'высокий' : 'очень высокий'; };

  // Как показатели влияют на выживание
  const poor = () => S.st.w <= 8;
  const healthFactor = () => 1 + Math.max(0, 50 - S.st.h) / 50;
  const wealthFactor = () => (S.st.w <= 8 ? 1.6 : S.st.w <= 20 ? 1.2 : S.st.w >= 60 ? 0.6 : 1);

  // Смертность по демографической статистике эпохи (stats.js)
  function mortality() {
    const a = S.age, p = D.statFor(S.year);
    const child = S.realism ? 1 : 0.35;
    let q;
    if (a === 0) q = p.infant / 1000 * child;
    else if (a < 5) q = p.infant / 1000 * 0.12 * child;
    else if (a < 15) q = S.year < 1917 ? 0.005 : S.year < 1946 ? 0.003 : 0.0006;
    else q = p.a[sexIdx()] * Math.exp(0.085 * (a - 20)) * (D.CLASS_MORT[S.cls] || 1);
    q *= healthFactor() * wealthFactor() * (S.st.j <= 10 ? 1.3 : 1);
    return Math.min(q, 0.7);
  }

  function naturalCause() {
    const a = S.age, p = D.statFor(S.year);
    if (poor() && Math.random() < 0.6) return T(a < 5 ? 'умер{|ла} в раннем детстве: семья голодала' : 'умер{|ла} в нищете, от голода и болезней');
    if (a < 5) return T('умер{|ла} в раннем детстве от болезни');
    if (a >= 78) return T('умер{|ла} от старости');
    if (S.st.j <= 10 && Math.random() < 0.3) return T('умер{|ла}, не вынеся горя и тоски');
    return T(pick(p.causes));
  }

  function yearTick() {
    normalizeClass();
    const st = S.st;
    if (S.age > 50) st.h -= rnd(0, 1);
    if (S.age > 70) st.h -= rnd(0, 2);
    if (S.age < 35) st.h += rnd(0, 2);
    // Достаток тянется к доходу; дети требуют расходов
    const inc = income();
    if (Math.random() < 0.6) st.w += Math.sign(inc - st.w) * rnd(1, 2);
    const young = S.children.filter(c => c.alive && S.year - c.birth < 16).length;
    if (young && Math.random() < 0.15 * young) st.w -= 1;
    // Бедность, богатство, тоска
    if (poor()) { st.h -= rnd(1, 3); st.j -= rnd(1, 2); }
    else if (st.w >= 60) st.h += rnd(0, 1);
    if (st.j <= 10) st.h -= rnd(0, 2);
    if (S.spouse && S.spouse.alive) st.j += rnd(0, 1);
    st.j += Math.sign(55 - st.j) * rnd(0, 1);
    for (const k in st) st[k] = clamp(st[k]);
    if (poor() && !S.flags.wasPoor) S.news.push('Вы впали в нищету. Пока денег нет, каждый год здоровье и настроение будут ухудшаться, а любая болезнь станет опаснее.');
    if (!poor() && S.flags.wasPoor) S.news.push('Вы выбрались из нищеты.');
    S.flags.wasPoor = poor();
    familyTick();

    const r = ruler();
    if (!S.flags.emigrant && !S.rulers.includes(r)) S.rulers.push(r);
    const name = placeEntry(S.place, S.year);
    if (name[1] !== S.cityName) {
      S.cityName = name[1];
      if (name[3]) { S.news.push(name[3]); addLog(name[3], 'rename'); }
    }
    const armored = S.age <= S.armor;
    if (st.h <= 0 && armored) st.h = 5;
    if (st.h <= 0 || (!armored && Math.random() < mortality())) { S.alive = false; S.cause = naturalCause(); }
  }

  function inRange(ev) {
    if (ev.year != null && (S.year < ev.year || S.year > (ev.to ?? ev.year))) return false;
    if (ev.age && (S.age < ev.age[0] || S.age > ev.age[1])) return false;
    return true;
  }

  function findEvent() {
    for (const ev of S.echoes) {
      if (S.done[ev.id] || S.year < ev.due) continue;
      if (S.year > ev.due + 20) { S.done[ev.id] = 1; continue; }
      if (ev.when && !ev.when(S)) continue;
      return ev;
    }
    for (const ev of S.fate.beats) {
      if (S.done[ev.id] || !inRange(ev)) continue;
      if (ev.when && !ev.when(S)) continue;
      return ev;
    }
    for (const ev of D.HIST) {
      if (S.done[ev.id]) continue;
      const to = ev.to || ev.year;
      if (S.year < ev.year || S.year > to) continue;
      if (ev.ussr && S.flags.emigrant) continue;
      if (ev.emig && !S.flags.emigrant) continue;
      if (ev.when && !ev.when(S)) { if (S.year === to) S.done[ev.id] = 1; continue; }
      if (S.age < (ev.skipUnder ?? 5)) {
        S.done[ev.id] = 1;
        addLog(`${ev.tag}: ${T(ev.title)} — вы были ещё совсем ${S.g === 'm' ? 'маленьким' : 'маленькой'}`, 'missed');
        continue;
      }
      return ev;
    }
    for (const ev of D.PERSONAL) {
      if (S.done[ev.id] || (ev.grp && S.done['g:' + ev.grp])) continue;
      if (S.age < ev.age[0] || S.age > ev.age[1]) continue;
      if (ev.when && !ev.when(S)) continue;
      const chance = val(ev.chance, S);
      if (chance != null) {
        if (S.rolled[ev.id] === S.year) continue;
        S.rolled[ev.id] = S.year;
        if (Math.random() > chance) continue;
      }
      return ev;
    }
    return null;
  }

  function advance() {
    if (!S.alive) return renderEnd();
    let ev = findEvent();
    const from = S.year + 1;
    for (let guard = 0; !ev && guard < 150; guard++) {
      S.year++; S.age++;
      yearTick();
      if (!S.alive) { quietLog(from, S.year - 1); return renderEnd(); }
      ev = findEvent();
      if (ev) quietLog(from, S.year - 1);
    }
    if (ev) showEvent(ev); else renderEnd();
  }
  function quietLog(a, b) { if (b - a >= 2) addLog('Годы шли своим чередом', 'quiet', a, b); }

  // ---------- Задания в формате ЕГЭ ----------
  // Факты берутся из эпохи героя. Уже встречавшиеся (в этой и прошлых жизнях) идут в последнюю очередь.
  const ROMAN = n => [['M', 1000], ['CM', 900], ['D', 500], ['CD', 400], ['C', 100], ['XC', 90], ['L', 50], ['XL', 40], ['X', 10], ['IX', 9], ['V', 5], ['IV', 4], ['I', 1]]
    .reduce((s, [r, v]) => { while (n >= v) { s += r; n -= v; } return s; }, '');
  function windowItems(list, yi, need, back = 40) {
    let lo = Math.max(862, S.birth - back);
    let items = list.filter(x => x[yi] >= lo && x[yi] <= S.year);
    while (new Set(items.map(x => x[yi])).size < need && lo > 862) {
      lo -= 30;
      items = list.filter(x => x[yi] >= lo && x[yi] <= S.year);
    }
    return items;
  }
  function prefer(items, key) {
    const seen = new Set(load('seenF', []));
    const notUsed = items.filter(x => !S.usedF.has(key(x)));
    const fresh = notUsed.filter(x => !seen.has(key(x)));
    return shuffle(fresh).concat(shuffle(notUsed.filter(x => seen.has(key(x)))));
  }
  function markUsed(keys) {
    const seen = load('seenF', []);
    for (const k of keys) { S.usedF.add(k); if (!seen.includes(k)) seen.push(k); }
    save('seenF', seen.slice(-800));
  }
  function distinctBy(items, fn, n) {
    const out = [], seen = new Set();
    for (const it of items) { const k = fn(it); if (!seen.has(k)) { seen.add(k); out.push(it); } if (out.length === n) break; }
    return out.length === n ? out : null;
  }
  const kE = e => 'E' + e[0] + e[1], kP = p => 'P' + p[0] + p[2], kT = t => 'T' + t[0], kC = c => 'C' + c[0];

  const GEN = {
    order() {
      const ev = distinctBy(prefer(windowItems(D.FACTS.EVENTS, 0, 3), kE), e => e[0], 3);
      if (!ev) return null;
      markUsed(ev.map(kE));
      return { type: 'order', max: 1, items: ev.map(e => ({ t: e[1], y: e[0] })), picked: [] };
    },
    dates() {
      const six = distinctBy(prefer(windowItems(D.FACTS.EVENTS, 0, 6), kE), e => e[0], 6);
      if (!six) return null;
      markUsed(six.slice(0, 4).map(kE));
      const rows = six.slice(0, 4).sort((a, b) => a[0] - b[0]), opts = shuffle(six);
      return { type: 'match', max: 2, head: 'Установите соответствие между годами и событиями: к каждому году подберите событие. Два события лишние.',
        rows: rows.map(r => ({ label: `${r[0]} г.`, ans: opts.indexOf(r) })), opts: opts.map(o => o[1]) };
    },
    people() {
      const six = distinctBy(prefer(windowItems(D.FACTS.PEOPLE, 1, 6), kP), p => p[0], 6);
      if (!six) return null;
      markUsed(six.slice(0, 4).map(kP));
      const rows = six.slice(0, 4), opts = shuffle(six);
      return { type: 'match', max: 2, head: 'Установите соответствие между историческими личностями и событиями (делами), связанными с ними. Два события лишние.',
        rows: rows.map(r => ({ label: r[0], ans: opts.indexOf(r) })), opts: opts.map(o => o[2]) };
    },
    terms() {
      const six = distinctBy(prefer(windowItems(D.FACTS.TERMS, 2, 6, 120), kT), t => t[0], 6);
      if (!six) return null;
      markUsed(six.slice(0, 4).map(kT));
      const rows = six.slice(0, 4), opts = shuffle(six);
      return { type: 'match', max: 2, head: 'Установите соответствие между терминами и их определениями. Два определения лишние.',
        rows: rows.map(r => ({ label: r[0], ans: opts.indexOf(r) })), opts: opts.map(o => cap(o[1])) };
    },
    term() {
      const pool = prefer(windowItems(D.FACTS.TERMS, 2, 4, 150), kT);
      if (pool.length < 4) return null;
      const right = pool[0];
      const others = shuffle(D.FACTS.TERMS.filter(t => t !== right && Math.abs(t[2] - right[2]) < 400)).slice(0, 3);
      markUsed([kT(right)]);
      const opts = shuffle([right, ...others]);
      return { type: 'single', max: 1, q: `Какой термин обозначает ${right[1]}?`, opts: opts.map(o => o[0]), ans: opts.indexOf(right) };
    },
    odd() {
      const lo = Math.max(862, S.year - 80);
      const inner = distinctBy(prefer(D.FACTS.TERMS.filter(t => t[2] >= lo && t[2] <= S.year), kT), t => t[0], 4);
      if (!inner) return null;
      const past = D.FACTS.TERMS.filter(t => t[2] <= S.year - 150);
      const outer = shuffle(past.length >= 2 ? past : D.FACTS.TERMS.filter(t => Math.abs(t[2] - S.year) >= 150)).slice(0, 2);
      if (outer.length < 2) return null;
      markUsed(inner.map(kT));
      const opts = shuffle([...inner, ...outer]);
      return { type: 'odd', max: 2, q: `Ниже приведён перечень терминов. Все они, за исключением двух, относятся к событиям (явлениям) ${lo}–${S.year} годов. Найдите два термина, относящихся к другому историческому периоду.`,
        opts: opts.map(o => o[0]), extra: outer.map(o => opts.indexOf(o)), years: opts.map(o => o[2]), sel: [] };
    },
    culture() {
      const six = distinctBy(prefer(windowItems(D.FACTS.CULTURE, 2, 6, 100), kC), c => c[1], 6);
      if (!six) return null;
      markUsed(six.slice(0, 4).map(kC));
      const rows = six.slice(0, 4), opts = shuffle(six);
      return { type: 'match', max: 2, head: 'Установите соответствие между памятниками культуры и их создателями. Два имени лишние.',
        rows: rows.map(r => ({ label: r[0], ans: opts.indexOf(r) })), opts: opts.map(o => o[1]) };
    },
    year() {
      const ev = prefer(windowItems(D.FACTS.EVENTS, 0, 1), kE)[0];
      if (!ev) return null;
      markUsed([kE(ev)]);
      return { type: 'year', max: 1, q: `Укажите год, когда произошло событие: ${ev[1]}.`, ans: ev[0] };
    },
    person() {
      const pool = distinctBy(prefer(windowItems(D.FACTS.PEOPLE, 1, 4), kP), p => p[0], 4);
      if (!pool) return null;
      const right = pool[0];
      markUsed([kP(right)]);
      const opts = shuffle(pool);
      return { type: 'single', max: 1, q: `С кем из исторических деятелей связано: ${right[2]}?`, opts: opts.map(o => o[0]), ans: opts.indexOf(right) };
    },
  };
  const GEN_WEIGHTS = [['order', 3], ['dates', 2], ['people', 2], ['terms', 2], ['term', 2], ['odd', 2], ['culture', 2], ['year', 2], ['person', 1]];

  function makeTask(force) {
    if (!force) {
      if (S.sinceTask < 3 || S.freeTasks >= 7) return null;
      const chance = cur.ev.beat ? 0.4 : D.PERSONAL.includes(cur.ev) ? 0.1 : 0.28;
      if (Math.random() > chance) return null;
    }
    const order = shuffle(GEN_WEIGHTS.flatMap(([g, w]) => Array(w).fill(g))).filter(g => g !== S.lastType);
    for (const g of [...new Set(order)]) {
      const t = GEN[g]();
      if (t) { S.lastType = g; S.sinceTask = 0; if (!force) S.freeTasks++; return t; }
    }
    return null;
  }

  // ---------- Показ события ----------
  const KID_CHOICES = [
    { t: 'Расспросить взрослых', fx: { k: 2 }, res: 'Взрослые объяснили, как могли. Вы запомнили этот день на всю жизнь.' },
    { t: 'Играть с другими детьми', fx: { j: 2 }, res: 'Дети играли «в войну» и «в царя» — так они переживали то, что видели вокруг.' },
    { t: 'Помогать матери по дому', fx: { w: 1, h: 1 }, res: 'В трудные времена даже маленьким детям хватало работы.' },
  ];
  const FALLBACK = [
    { t: 'Жить своей жизнью', fx: { j: 1 }, res: 'Большие события шли стороной, а у вас хватало своих забот.' },
    { t: 'Обсуждать новости с соседями', fx: { k: 1 }, res: 'Слухи ходили самые разные.' },
  ];

  function showEvent(ev) {
    S.tmp = {};
    S.sinceTask++;
    if (ev.prep) ev.prep(S);
    const personal = !!ev.beat || D.PERSONAL.includes(ev);
    const child = !personal && S.age < (ev.minAge ?? 14);
    let choices = (child ? (ev.kid || KID_CHOICES) : ev.choices || []).filter(c => !c.when || c.when(S));
    for (const f of (child ? KID_CHOICES : FALLBACK)) if (choices.length < 2 && !choices.includes(f)) choices.push(f);
    if (choices.every(c => c.need && S.st.w < c.need)) choices.push(FALLBACK[0]);
    cur = {
      ev, personal, child, choices, phase: 'choose', result: '', notes: [], dead: false, delta: {},
      title: T(ev.title), text: T(ev.text), news: S.news.splice(0),
      quiz: val(ev.quiz, S) || null, task: null,
    };
    renderLife();
  }

  // Применить последствия выбора или ответа. Возвращает true, если герой погиб.
  function applyOutcome(o, fallbackCause) {
    const before = { ...S.st };
    for (const k in (o.fx || {})) {
      const nv = S.st[k] + o.fx[k];
      if (k === 'w' && nv < 0) { // не хватило денег — расплачиваемся здоровьем и долгами
        const debt = -nv;
        S.st.h = clamp(S.st.h - Math.ceil(debt / 2));
        S.st.j = clamp(S.st.j - Math.ceil(debt / 2));
        cur.notes.push(`Денег не хватило: пришлось влезть в долги и голодать.`);
      }
      S.st[k] = clamp(nv);
    }
    for (const k in S.st) cur.delta[k] = (cur.delta[k] || 0) + S.st[k] - before[k];
    if (o.set) Object.assign(S.flags, o.set);
    if (o.cls) S.cls = val(o.cls, S);
    if (o.prof) S.prof = T(o.prof);
    let pl = val(o.place, S);
    if (pl === 'city') pl = wpick(D.CITY_WEIGHTS.filter(([k]) => k !== S.place && avail(k, S.year)));
    if (pl) { S.place = pl; S.cityName = placeEntry(pl, S.year)[1]; }
    if (o.surname && S.flags.nosurname) delete S.flags.nosurname;
    if (o.married || (o.set && o.set.married)) marry();
    if (o.kid) {
      S.kids += o.kid;
      addChild(S.tmp.child === 'дочь' ? 'f' : 'm');
      // Мать могла умереть родами — если герой мужчина, рискует его жена
      if (S.g === 'm' && S.spouse && S.spouse.alive && Math.random() < D.statFor(S.year).mm) spouseDies('умерла родами');
    }
    if (o.lost) { S.kidsLost += o.lost; const c = S.children[S.children.length - 1]; if (c) childDies(c, c.g === 'f' ? 'умерла в раннем детстве' : 'умер в раннем детстве'); }
    if (o.badge) { const b = T(o.badge); if (!S.badges.includes(b)) S.badges.push(b); }
    if (o.echo) {
      const e = o.echo;
      S.echoes.push({ ...e, id: `${e.id || 'echo'}_${S.year}_${S.echoes.length}`, beat: true, echo: true, icon: e.icon || '⏳', due: S.year + rnd(e.after[0], e.after[1]) });
    }
    const risk = val(o.risk, S);
    if (risk && Math.random() < Math.min(0.95, risk * healthFactor())) { S.alive = false; S.cause = T(o.cause || fallbackCause || 'погиб{|ла}'); return true; }
    if (o.die) { S.alive = false; S.cause = T(o.die); return true; }
    return false;
  }

  function choose(i) {
    const ev = cur.ev, c = cur.choices[i];
    if (c.need && S.st.w < c.need) return;
    const o = c.alt && Math.random() < val(c.alt.p, S) ? { ...c, ...c.alt } : c;
    if (!o.again && !ev.repeat) { S.done[ev.id] = 1; if (ev.grp) S.done['g:' + ev.grp] = 1; }
    let dead = applyOutcome(o, ev.cause);
    const er = ev.risk && (ev.beat || S.age > S.armor) ? ev.risk(S) * wealthFactor() * healthFactor() : 0;
    if (!dead && er && Math.random() < er) { dead = true; S.alive = false; S.cause = T(ev.cause); }
    if (!dead && o.after) {
      const extra = o.after(S);
      if (extra) { if (extra.res) cur.notes.push(T(extra.res)); if (extra.dead) { dead = true; S.alive = false; S.cause = T(extra.cause); } }
    }
    if (!dead && S.st.h <= 0) { dead = true; S.alive = false; S.cause = T(poor() ? 'умер{|ла} в нищете, от голода и болезней' : 'умер{|ла} от болезней и лишений'); }

    addLog(`${cur.title} — ${T(c.t).toLowerCase()}`, ev.beat ? 'beat' : cur.personal ? 'personal' : 'hist');
    cur.phase = 'result';
    cur.dead = dead;
    cur.result = T(o.res);
    if (!dead) {
      const st = cur.quiz ? stakeOf(cur.quiz) : {};
      cur.task = makeTask(!!(st.win || st.lose));
    }
    renderLife();
  }

  const stakeOf = q => ({ win: val(q.win, S), lose: val(q.lose, S) });

  function finishTask(errors) {
    const t = cur.task;
    t.done = true;
    t.errors = errors;
    t.points = t.max === 1 ? (errors ? 0 : 1) : Math.max(0, 2 - errors);
    t.success = t.max === 1 ? errors === 0 : errors <= 1;
    S.score.total += t.max;
    S.score.ok += t.points;
    S.st.k = clamp(S.st.k + t.points * 2);
    const q = cur.quiz;
    if (q) {
      const { win, lose } = stakeOf(q);
      t.trial = !!(win || lose);
      const o = t.success ? win : lose;
      if (o) {
        t.outcome = T(o.res);
        addLog(`${t.success ? 'Удача' : 'Неудача'}: ${T(o.log || o.res).replace(/\.$/, '')}`, t.success ? 'win' : 'lose');
        if (applyOutcome(o, cur.ev.cause)) cur.dead = true;
        else if (S.st.h <= 0) { cur.dead = true; S.alive = false; S.cause = T('умер{|ла} от болезней и лишений'); }
      }
    }
    renderLife();
  }
  function orderPick(i) {
    const t = cur.task;
    if (t.done || t.picked.includes(i)) return;
    t.picked.push(i);
    if (t.picked.length === t.items.length) {
      const years = t.picked.map(k => t.items[k].y);
      finishTask(years.every((y, k) => k === 0 || y > years[k - 1]) ? 0 : 1);
    } else renderLife();
  }
  function checkMatch() {
    const t = cur.task;
    const sel = [...app.querySelectorAll('.match-row select')].map(s => (s.value === '' ? -1 : +s.value));
    if (sel.some(v => v < 0)) return;
    t.answers = sel;
    finishTask(t.rows.reduce((e, r, k) => e + (sel[k] === r.ans ? 0 : 1), 0));
  }
  function oddToggle(i) {
    const t = cur.task;
    if (t.done) return;
    t.sel = t.sel.includes(i) ? t.sel.filter(x => x !== i) : t.sel.length < 2 ? [...t.sel, i] : t.sel;
    renderLife();
  }
  function checkYear() {
    const v = parseInt(app.querySelector('#yearIn')?.value, 10);
    if (!v) return;
    cur.task.answer = v;
    finishTask(v === cur.task.ans ? 0 : 1);
  }

  // ---------- Отрисовка ----------
  const STATS = [['h', 'Здоровье'], ['w', 'Достаток'], ['k', 'Знания'], ['j', 'Счастье']];

  function warnings() {
    const w = [];
    if (poor()) w.push('Нищета: здоровье и настроение падают каждый год, болезни опаснее.');
    if (S.st.h <= 30) w.push('Слабое здоровье: рискованные поступки могут стать смертельными.');
    if (S.st.j <= 10) w.push('Тоска: вы теряете здоровье.');
    if (S.st.w >= 60) w.push('Достаток: хорошая еда и лекари — бедствия переносить легче.');
    return w;
  }

  function familyLine() {
    const parts = [];
    const sp = S.spouse;
    if (sp && sp.alive) parts.push(`${sp.g === 'f' ? 'жена' : 'муж'} ${sp.name}, ${ageStr(S.year - sp.birth)}`);
    else if (S.flags.widow) parts.push(T('вдов{ец|а}'));
    const kids = S.children.filter(c => c.alive);
    if (kids.length) {
      const shown = kids.slice(0, 4).map(c => `${c.name}, ${S.year - c.birth}`).join('; ');
      parts.push(`${kids.length === 1 ? (kids[0].g === 'f' ? 'дочь' : 'сын') : 'дети'}: ${shown}${kids.length > 4 ? ` и ещё ${kids.length - 4}` : ''}`);
    }
    return parts.length ? `<div class="family">👪 ${parts.join(' · ')}</div>` : '';
  }

  function statusHTML() {
    const cls = D.CLASS[S.cls] ? T(D.CLASS[S.cls].label) : '';
    const meta = [cls, S.prof, placeEntry(S.place, S.year)[1]].filter(Boolean).join(' · ');
    const badges = S.badges.length ? `<div class="badges">${S.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : '';
    const warn = warnings();
    return `
      <section class="status" aria-label="Ваш персонаж">
        <div class="status-top">
          <div class="who-wrap">
            ${D.avatarSVG(S, 52)}
            <div>
              <div class="who">${fullName()}</div>
              <div class="meta">${meta}</div>
              ${familyLine()}
            </div>
          </div>
          <div class="when"><div class="year">${S.year}</div><div class="age">${ageStr(S.age)}</div></div>
        </div>
        <div class="realm"><span>${stateName()}</span><span>У власти: ${S.flags.emigrant ? 'на родине — ' : ''}${ruler()}</span><span>Доход: ${incomeLabel()}</span></div>
        <div class="bars">${STATS.map(([k, n]) => `
          <div class="bar bar-${k}${S.st[k] <= (k === 'w' ? 8 : k === 'h' ? 30 : 10) && k !== 'k' ? ' low' : ''}"><span class="bar-label">${n}</span><span class="bar-track"><span style="width:${S.st[k]}%"></span></span><span class="bar-num">${S.st[k]}</span></div>`).join('')}
        </div>
        ${warn.length ? `<div class="warn">${warn.map(x => `<div>${x}</div>`).join('')}</div>` : ''}
        ${badges}
      </section>`;
  }

  function chronicleHTML(open) {
    if (!S.log.length) return '';
    const items = S.log.slice().reverse().map(e => `
      <li class="log-${e.type}"><span class="log-y">${e.y2 ? `${e.y1}–${e.y2}` : e.y1}</span><span class="log-t">${e.text}</span></li>`).join('');
    return `<details class="chronicle"${open ? ' open' : ''}><summary>Летопись жизни <span class="muted">(${S.log.length})</span></summary><ol>${items}</ol></details>`;
  }

  function deltaHTML() {
    const names = { h: 'Здоровье', w: 'Достаток', k: 'Знания', j: 'Счастье' };
    const chips = Object.entries(cur.delta).filter(([, v]) => v).map(([k, v]) => `<span class="dchip ${v > 0 ? 'up' : 'down'}">${names[k]} ${v > 0 ? '+' : '−'}${Math.abs(v)}</span>`);
    return chips.length ? `<div class="deltas">${chips.join('')}</div>` : '';
  }

  function taskHTML() {
    const t = cur.task;
    if (!t) return '';
    const q = cur.quiz;
    const { win, lose } = q ? stakeOf(q) : {};
    const stake = !t.done && (win || lose)
      ? `<div class="stake"><div class="trial-h">⚖️ Испытание</div>${T(q.stake) || 'От того, как вы справитесь, зависит ваша судьба.'}<div class="stake-rule">Чтобы пройти испытание, ${t.max === 1 ? 'ответьте без ошибок' : 'допустите не больше одной ошибки'}.</div></div>` : '';
    let body = '';
    if (t.type === 'order') {
      body = `<p class="task-q">Расположите события в хронологической последовательности. Нажимайте по порядку — от самого раннего к самому позднему.</p>
        <div class="order">${t.items.map((it, i) => {
          const n = t.picked.indexOf(i);
          return `<button class="order-item${n >= 0 ? ' picked' : ''}" data-act="ord" data-i="${i}" ${t.done ? 'disabled' : ''}><span class="key">${n >= 0 ? n + 1 : '·'}</span><span>${it.t}</span>${t.done ? `<span class="yr">${it.y}</span>` : ''}</button>`;
        }).join('')}</div>
        ${!t.done && t.picked.length ? '<button class="ghost small" data-act="ordReset">Сбросить</button>' : ''}`;
      if (t.done) {
        const right = t.items.map((_, i) => i).sort((a, b) => t.items[a].y - t.items[b].y);
        body += `<div class="verdict ${t.errors ? 'bad' : 'ok'}">${t.errors ? '✗ Неверно. Правильно: ' + right.map(i => `${t.items[i].t} (${t.items[i].y})`).join(' → ') : '✓ Верно! 1 балл'}</div>`;
      }
    } else if (t.type === 'match') {
      body = `<p class="task-q">${t.head}</p>
        <ol class="opts-list">${t.opts.map(o => `<li>${o}</li>`).join('')}</ol>
        <div class="match">${t.rows.map((r, k) => {
          const mark = t.done ? (t.answers[k] === r.ans ? '<span class="ok">✓</span>' : `<span class="bad">✗ верно: ${r.ans + 1}</span>`) : '';
          return `<label class="match-row"><span class="match-label">${String.fromCharCode(1040 + k)}) ${r.label}</span>
            <select ${t.done ? 'disabled' : ''}><option value="">—</option>${t.opts.map((_, i) => `<option value="${i}"${t.done && t.answers[k] === i ? ' selected' : ''}>${i + 1}</option>`).join('')}</select>${mark}</label>`;
        }).join('')}</div>
        ${t.done ? '' : '<button class="primary small" data-act="check">Проверить</button>'}`;
      if (t.done) body += `<div class="verdict ${t.errors ? (t.errors === 1 ? 'mid' : 'bad') : 'ok'}">${t.errors === 0 ? '✓ Всё верно! 2 балла' : t.errors === 1 ? '◐ Одна ошибка: 1 балл' : `✗ Ошибок: ${t.errors}. 0 баллов`}</div>`;
    } else if (t.type === 'single') {
      body = `<p class="task-q">${t.q}</p><div class="opts">${t.opts.map((o, i) => {
        let cls = 'opt';
        if (t.done) cls += i === t.ans ? ' opt-right' : i === t.answer ? ' opt-wrong' : ' opt-dim';
        return `<button class="${cls}" data-act="sng" data-i="${i}" ${t.done ? 'disabled' : ''}><span class="key">${i + 1}</span>${o}</button>`;
      }).join('')}</div>`;
      if (t.done) body += `<div class="verdict ${t.errors ? 'bad' : 'ok'}">${t.errors ? '✗ Неверно. Правильно: ' + t.opts[t.ans] : '✓ Верно! 1 балл'}</div>`;
    } else if (t.type === 'odd') {
      body = `<p class="task-q">${t.q}</p><div class="odd">${t.opts.map((o, i) => {
        let cls = 'odd-item';
        if (t.sel.includes(i)) cls += ' picked';
        if (t.done) cls += t.extra.includes(i) ? ' right' : t.sel.includes(i) ? ' wrong' : '';
        return `<button class="${cls}" data-act="odd" data-i="${i}" ${t.done ? 'disabled' : ''}>${o}${t.done ? `<span class="yr">${t.years[i] < 1000 ? 'IX–X' : ROMAN(Math.floor((t.years[i] - 1) / 100) + 1)} в.</span>` : ''}</button>`;
      }).join('')}</div>
        ${t.done ? '' : `<button class="primary small" data-act="oddCheck" ${t.sel.length === 2 ? '' : 'disabled'}>Проверить</button>`}`;
      if (t.done) body += `<div class="verdict ${t.errors ? (t.errors === 1 ? 'mid' : 'bad') : 'ok'}">${t.errors === 0 ? '✓ Верно! 2 балла' : t.errors === 1 ? '◐ Один термин найден верно: 1 балл' : '✗ Неверно. 0 баллов'}</div>`;
    } else if (t.type === 'year') {
      body = `<p class="task-q">${t.q}</p>
        <div class="year-row"><input id="yearIn" type="number" inputmode="numeric" placeholder="Год" ${t.done ? `disabled value="${t.answer}"` : ''}>
        ${t.done ? '' : '<button class="primary small" data-act="yearCheck">Ответить</button>'}</div>`;
      if (t.done) body += `<div class="verdict ${t.errors ? 'bad' : 'ok'}">${t.errors ? `✗ Неверно. Правильный ответ: ${t.ans}` : '✓ Верно! 1 балл'}</div>`;
    }
    const trial = t.done && t.trial
      ? `<div class="trial ${t.success ? 'ok' : 'bad'}"><div class="trial-h">${t.success ? '✅ Испытание пройдено' : '❌ Испытание не пройдено'}</div>${t.outcome || ''}</div>` : '';
    return `<div class="quiz"><div class="quiz-h">Задание</div>${trial}${stake}${body}${trial}</div>`;
  }

  function choiceHTML(c, i) {
    const short = c.need && S.st.w < c.need;
    const risk = val(c.risk, S);
    let tag = '';
    if (short) tag = '<span class="ctag">не хватает средств</span>';
    else if (risk >= 0.1) tag = `<span class="ctag danger">${S.st.h <= 30 ? 'смертельно опасно при вашем здоровье' : 'опасно'}</span>`;
    return `<button class="choice" data-act="choose" data-i="${i}" ${short ? 'disabled' : ''}><span class="key">${i + 1}</span><span>${T(c.t)}${tag}</span></button>`;
  }

  function cardHTML() {
    const ev = cur.ev;
    const news = cur.news.length ? `<div class="news">📰 ${cur.news.join('<br>📰 ')}</div>` : '';
    const childNote = cur.child ? `<p class="childnote">Вам всего ${ageStr(S.age)}. ${T(ev.child)}</p>` : '';
    let body = '';
    if (cur.phase === 'choose') {
      body = `<div class="choices">${cur.choices.map(choiceHTML).join('')}</div>`;
    } else {
      const res = (cur.result ? `<p class="result">${cur.result}</p>` : '') + cur.notes.map(n => `<p class="result note">${n}</p>`).join('');
      const fact = cur.quiz && cur.quiz.f ? `<div class="fact"><b>Справка.</b> ${cur.quiz.f}</div>` : '';
      const death = cur.dead ? `<div class="death">🕯️ ${shortName()} ${S.cause}.</div>` : '';
      const ready = !cur.task || cur.task.done || cur.dead;
      const next = ready ? `<button class="primary next" data-act="next">${cur.dead ? 'Итоги жизни' : 'Жить дальше →'}</button>` : '';
      // Справка — после задания, чтобы не подсказывала ответ
      body = res + deltaHTML() + taskHTML() + (!cur.task || cur.task.done ? fact : '') + death + next;
    }
    const tag = ev.echo ? 'Отголосок прошлого' : ev.beat ? 'Ваша жизнь' : ev.tag || '';
    return `
      <article class="card${cur.phase === 'choose' ? ' enter' : ''}${ev.beat ? ' story' : ''}">
        <div class="card-head">
          <span class="icon" aria-hidden="true">${ev.icon || '•'}</span>
          <div><div class="tag">${tag}</div><h2>${cur.title}</h2>
          <div class="date">${S.year} год · вам ${ageStr(S.age)}</div></div>
        </div>
        ${news}${childNote}<p class="text">${cur.text}</p>${body}
      </article>`;
  }

  function renderLife() {
    app.innerHTML = statusHTML() + cardHTML() + chronicleHTML(false);
    const card = app.querySelector('.card');
    if (card && cur.phase === 'choose') card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  function renderStart() {
    const st = stats();
    const opts = Object.entries(D.ERAS).map(([k, e]) =>
      `<option value="${k}">${e.label}${k === 'random' ? '' : ` (${e.range[0]}–${e.range[1]})`}</option>`).join('');
    const allBadges = load('badges', []);
    app.innerHTML = `
      <section class="hero">
        <div class="eyebrow">Историческая игра-тренажёр · от Рюрика до наших дней</div>
        <h1>Одна жизнь <span class="hl">в России</span></h1>
        <p class="lead">Вам выпадет чужая судьба — в случайную эпоху, в случайном сословии. Кем вы окажетесь и чем всё кончится, зависит от ваших решений и от того, как хорошо вы знаете историю.</p>
        <div class="start">
          <label for="era">Эпоха</label>
          <select id="era">${opts}</select>
          <button class="primary" data-act="start">Родиться</button>
          <label class="check"><input type="checkbox" id="realism" ${load('realism', false) ? 'checked' : ''}> Реальная смертность эпохи для главного героя (жизнь может оборваться в любой момент)</label>
        </div>
        ${st.lives ? `<p class="muted">Прожито жизней: ${st.lives} · баллов за задания: ${st.ok} из ${st.total}</p>` : ''}
        ${allBadges.length ? `<div class="badges">${allBadges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : ''}
        <ul class="how">
          <li><b>Решения меняют судьбу.</b> Поступки возвращаются через годы: спасённый когда-то человек может спасти вас, а донос — аукнуться.</li>
          <li><b>Задания как на ЕГЭ.</b> Хронология, даты, личности, термины, памятники культуры — из эпохи, в которой вы живёте. Иногда от результата зависит жизнь.</li>
          <li><b>Семья, деньги и здоровье.</b> Супруги, дети, внуки. В нищете болеют и умирают, лечение стоит денег, а слабому опасно рисковать.</li>
          <li><b>Статистика эпохи.</b> Продолжительность жизни, детская смертность и причины смерти зависят от века, сословия и пола.</li>
        </ul>
      </section>`;
  }

  function statsHTML(year, withClass) {
    const p = D.statFor(year);
    const n = Math.round(1000 / p.infant);
    const infant = p.infant >= 100
      ? `до года не доживал примерно каждый ${n}-й ребёнок (${p.infant} из 1000)`
      : `до года не доживали ${p.infant} младенцев из 1000`;
    const note = withClass && D.CLASS[S.cls].note ? `<li>${T(D.CLASS[S.cls].note)}</li>` : '';
    return `<div class="statbox"><b>Статистика вашего времени</b><ul>
      <li>Средняя продолжительность жизни: ${p.le}. Главная причина — детская смертность: ${infant}.</li>
      <li>Кто доживал до 20 лет, жил в среднем до ${p.e20[0]} (мужчины) и ${p.e20[1]} (женщины).</li>
      <li>Детей у женщины в среднем: ${String(p.tfr).replace('.', ',')}.</li>
      <li>Грамотность: ${p.lit}.</li>${note}</ul></div>`;
  }

  function renderBirth() {
    const was = S.age; S.age = 25; // в начале показываем, каким герой вырастет
    const portrait = D.avatarSVG(S, 96);
    S.age = was;
    app.innerHTML = `
      <article class="card birth">
        <div class="tag">Новая жизнь</div>
        <div class="birth-head">${portrait}<h2>${fullName()}</h2></div>
        <p class="text">Вы ${T('{родился|родилась}')} ${S.day} ${MONTHS[S.month]} ${S.birth} года ${placeEntry(S.place, S.birth)[2]}, в ${T(D.CLASS[S.cls].birth)}.</p>
        <p class="text teaser">${T(S.fate.intro)}</p>
        <dl class="facts">
          <div><dt>Государство</dt><dd>${byYear(D.STATES, S.birth)}</dd></div>
          <div><dt>У власти</dt><dd>${ruler()}</dd></div>
        </dl>
        ${statsHTML(S.birth, true)}
        ${S.flags.nosurname ? '<div class="fact">Фамилии у вас нет: до XVI–XVIII веков фамилии были только у знати, а у крепостных — до 1860-х. Вас называют по отцу.</div>' : ''}
        <button class="primary next" data-act="next">Начать жизнь →</button>
      </article>`;
  }

  function rank(p) {
    if (p >= 0.9) return 'Академик';
    if (p >= 0.7) return 'Историк';
    if (p >= 0.4) return 'Краевед';
    return 'Любитель старины';
  }

  function familySummary() {
    const rows = [];
    for (const sp of [...S.exSpouses, S.spouse].filter(Boolean)) {
      rows.push(`${sp.g === 'f' ? 'Жена' : 'Муж'} ${sp.name} (${sp.birth}–${sp.alive ? '' : sp.died})${sp.alive ? ' пережил' + (sp.g === 'f' ? 'а' : '') + ' вас' : ', ' + sp.cause}`);
    }
    for (const c of S.children) {
      const status = c.alive ? `${c.g === 'f' ? 'дочь' : 'сын'}, к вашей смерти — ${ageStr(S.year - c.birth)}` : `${c.g === 'f' ? 'дочь' : 'сын'}, ${c.cause}`;
      rows.push(`${c.name} (род. ${c.birth}) — ${status}`);
    }
    return rows.length ? `<div class="fact family-end"><b>Семья</b><ul>${rows.map(r => `<li>${r}</li>`).join('')}</ul></div>` : '';
  }

  function renderEnd() {
    if (!S.ended) {
      S.ended = true;
      addLog(cap(S.cause), 'death');
      const st = stats();
      st.lives++; st.ok += S.score.ok; st.total += S.score.total; st.longest = Math.max(st.longest, S.age);
      save('stats', st);
      const played = load('played', []);
      if (!played.includes(S.fate.id)) { played.push(S.fate.id); save('played', played); }
      const all = load('badges', []);
      for (const b of S.badges) if (!all.includes(b)) all.push(b);
      save('badges', all);
    }
    const { ok, total } = S.score;
    const p = total ? ok / total : 0;
    const stat = D.statFor(S.birth);
    const e20 = stat.e20[sexIdx()];
    const compare = `Средняя продолжительность жизни в год вашего рождения — ${stat.le}; кто доживал до 20, жил в среднем до ${e20}. ${S.age >= e20 ? 'Ваша жизнь оказалась дольше средней.' : 'Ваша жизнь оказалась короче средней.'}`;
    const epilogue = T(S.fate.epilogue);
    app.innerHTML = `
      <article class="card epitaph">
        <div class="tag">Жизнь прожита</div>
        <div class="end-portrait">${D.avatarSVG(S, 120)}</div>
        <div class="fate-big">${S.fate.icon} ${S.fate.title}</div>
        <h2>${fullName()}</h2>
        <div class="dates">${S.birth} — ${S.year}</div>
        <p class="text">${shortName()} ${S.cause}. ${T('Прожил{|а}')} ${ageStr(S.age)}.</p>
        ${epilogue ? `<p class="text teaser">${epilogue}</p>` : ''}
        ${S.badges.length ? `<div class="badges center">${S.badges.map(b => `<span class="badge">${b}</span>`).join('')}</div>` : ''}
        <div class="score">
          <div><div class="big">${ok}<span>/${total}</span></div><div class="muted">баллов за задания</div></div>
          <div><div class="big">${total ? rank(p) : '—'}</div><div class="muted">ваше звание</div></div>
          <div><div class="big">${S.children.length}</div><div class="muted">${plural(S.children.length, 'ребёнок', 'ребёнка', 'детей')}</div></div>
        </div>
        ${familySummary()}
        <div class="fact">${compare}</div>
        ${S.rulers.length ? `<div class="fact"><b>На вашем веку у власти были:</b> ${S.rulers.join(' → ')}</div>` : ''}
        <div class="end-actions">
          <button class="primary" data-act="again">Прожить новую жизнь</button>
          <button class="ghost" data-act="share">Скопировать историю</button>
        </div>
      </article>
      ${chronicleHTML(true)}`;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function share(btn) {
    const story = S.log.filter(e => ['beat', 'win', 'lose', 'family'].includes(e.type)).map(e => `${e.y1}: ${e.text}`).join('\n');
    const text = `${S.fate.icon} ${S.fate.title}: ${fullName()} (${S.birth}–${S.year}) ${S.cause}.\n` +
      (S.badges.length ? `Достижения: ${S.badges.join(', ')}.\n` : '') + `${story}\n` +
      `Баллов за задания: ${S.score.ok} из ${S.score.total}. «Одна жизнь в России»: ${location.href}`;
    const done = () => { btn.textContent = 'Скопировано ✓'; };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done, () => prompt('Скопируйте:', text));
    else prompt('Скопируйте:', text);
  }

  // ---------- Управление ----------
  app.addEventListener('click', e => {
    const b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    const i = +b.dataset.i;
    switch (b.dataset.act) {
      case 'start':
        save('realism', document.getElementById('realism').checked);
        newLife(document.getElementById('era').value);
        break;
      case 'choose': choose(i); break;
      case 'ord': orderPick(i); break;
      case 'ordReset': cur.task.picked = []; renderLife(); break;
      case 'check': checkMatch(); break;
      case 'sng': if (!cur.task.done) { cur.task.answer = i; finishTask(i === cur.task.ans ? 0 : 1); } break;
      case 'odd': oddToggle(i); break;
      case 'oddCheck': finishTask(cur.task.sel.filter(x => !cur.task.extra.includes(x)).length); break;
      case 'yearCheck': checkYear(); break;
      case 'next': advance(); break;
      case 'again': renderStart(); window.scrollTo({ top: 0 }); break;
      case 'share': share(b); break;
    }
  });
  document.addEventListener('keydown', e => {
    if (e.target.id === 'yearIn' && e.key === 'Enter') { checkYear(); e.preventDefault(); return; }
    if (['SELECT', 'INPUT'].includes(e.target.tagName) || e.metaKey || e.ctrlKey) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 9) {
      const btns = app.querySelectorAll('.choices .choice:not([disabled]), .order-item:not([disabled]), .opts .opt:not([disabled])');
      if (btns[n - 1]) { btns[n - 1].click(); e.preventDefault(); }
    } else if (e.key === 'Enter') {
      const nx = app.querySelector('.next');
      if (nx) { nx.click(); e.preventDefault(); }
    }
  });
  document.querySelector('.brand')?.addEventListener('click', () => {
    if (!S || !S.alive || confirm('Начать заново? Текущая жизнь будет потеряна.')) renderStart();
  });

  renderStart();
})();

</script>
</body>
</html>
